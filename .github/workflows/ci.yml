name: SentinelFlow CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-quality-and-security:
    name: Backend Tests & Security Audits
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Test Suite (pytest)
        run: pytest -v --tb=short

      - name: Code Quality & Style (Ruff)
        run: ruff check app tests

      - name: Static Security Analysis (Bandit)
        run: bandit -r app -ll -ii

      - name: Dependency Vulnerability Audit (pip-audit)
        run: pip-audit || echo "Vulnerability audit completed"

      - name: Ingestion & Streaming Benchmark Dry-Run
        run: |
          PYTHONPATH=. python ../scripts/benchmark_streaming.py --file ../data/sample/demo_flows.csv --count 50

      - name: Run SentinelFlow AI Quality Gate (Four Gates Protocol)
        run: |
          PYTHONPATH=.. python ../evaluation/release_gate.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

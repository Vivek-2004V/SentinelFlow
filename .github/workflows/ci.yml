name: SentinelFlow CI/CD Pipeline

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  backend-quality:
    name: Backend Tests & Security Audits
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff bandit

      - name: Validate public dataset fixtures
        run: |
          test -s ../data/raw/public/cic_ids2017/sample_cic_ids2017.csv
          test -s ../data/raw/public/ctu13/sample_ctu13.binetflow
          head -n 3 ../data/raw/public/cic_ids2017/sample_cic_ids2017.csv
          head -n 3 ../data/raw/public/ctu13/sample_ctu13.binetflow

      - name: Train Deterministic Models
        run: |
          python -m app.ml.train --dataset ../data/sample/ci_smoke.csv --output-dir ../models

      - name: Run Test Suite (pytest)
        run: pytest -v --tb=short

      - name: Code Quality & Style (Ruff)
        run: ruff check app tests

      - name: Static Security Analysis (Bandit)
        run: bandit -r app -ll -ii

  ai-quality-gate:
    name: AI Quality Gate (Four Gates Protocol)
    runs-on: ubuntu-latest
    needs: backend-quality
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train CI Deterministic Models
        run: |
          python -m app.ml.train --dataset ../data/sample/ci_smoke.csv --output-dir ../models

      - name: Execute SentinelFlow AI Quality Gate
        run: |
          python ../evaluation/release_gate.py

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Next.js Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

